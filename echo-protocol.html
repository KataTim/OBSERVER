function vigenereEncrypt(text, key){
  key = key.toUpperCase().replace(/[^A-Z]/g,'');
  if(!key) return text;
  let out='', ki=0;
  for(const ch of text){
    if(/[A-Za-z]/.test(ch)){
      const isUpper = ch === ch.toUpperCase();
      const c = ch.toUpperCase().charCodeAt(0)-65;
      const k = key.charCodeAt(ki % key.length)-65;
      const e = (c+k)%26;
      const ech = String.fromCharCode(e+65);
      out += isUpper ? ech : ech.toLowerCase();
      ki++;
    } else out += ch;
  }
  return out;
}
function vigenereDecrypt(text,key){

/* ============ STATE ============ */
const state = {
  stage:"gate",
  attempts:0,
  nickname:"",
  qi:0,
  order:[],
  scores:{order:0,power:0,chaos:0,empathy:0,sacrifice:0,curiosity:0,deception:0,passive:0,neutral:0},
  total:0
};

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const app = document.getElementById("app");
function mount(html){ app.innerHTML = html; }
function corners(){ return `<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>`; }

/* ============ STAGE: GATE ============ */
function renderGate(){
  mount(`
    <div class="card" role="main">
      ${corners()}
      <p class="eyebrow">ECHO PROTOCOL // ACCESS GATE</p>
      <h1>存取終端 · 第一道門</h1>
      <p class="sub">以下訊息已被一種會移動的字母表加密。金鑰由散落在本頁面各處的四段殘留碎片組成——正確的閱讀順序,將決定它是否有意義。</p>

      <span class="field-label">密文</span>
      <div class="cipher-block">${CIPHER}</div>

      <span class="field-label">解密金鑰</span>
      <input id="keyInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入你拼湊出的金鑰...">

      <span class="field-label" style="margin-top:14px;display:block;">即時解密預覽</span>
      <div class="preview-block" id="preview">· · · · · · · · · ·</div>

      <div class="row">
        <button class="btn" id="confirmBtn">解密</button>
        <button class="toggle" id="hintBtn" type="button">訊號微弱...點此接收</button>
      </div>
      <p class="msg" id="gateMsg"></p>

      <div class="hints" id="hintPanel">
        <ol>
          <li>有些秘密只存在於這個頁面的骨架之中,而非它的血肉。</li>
          <li>選中一切,無視你所看見的。</li>
          <li>你的主控台一直在對你說話,只是你從未打開耳朵。</li>
          <li>分頁標題不曾停止低語。</li>
        </ol>
        <p style="margin:10px 0 0;color:var(--ink-faint);">四段碎片,依序拼接,即為金鑰。</p>
      </div>

      <div id="plaintextWrap"></div>
    </div>
  `);

  const keyInput = document.getElementById("keyInput");
  const preview = document.getElementById("preview");
  const hintBtn = document.getElementById("hintBtn");
  const hintPanel = document.getElementById("hintPanel");
  const confirmBtn = document.getElementById("confirmBtn");
  const gateMsg = document.getElementById("gateMsg");
  const card = document.querySelector(".card");

  hintBtn.addEventListener("click", ()=> hintPanel.classList.toggle("open"));

  keyInput.addEventListener("input", ()=>{
    const v = keyInput.value.trim();
    if(!v){ preview.textContent = "· · · · · · · · · ·"; preview.classList.remove("solved"); return; }
    const dec = vigenereDecrypt(CIPHER, v);
    preview.textContent = dec;
    preview.classList.toggle("solved", v.toUpperCase().replace(/[^A-Z]/g,"") === KEYWORD);
  });

  function trySolve(){
    const norm = keyInput.value.toUpperCase().replace(/[^A-Z]/g,"");
    if(norm === KEYWORD){
      gateMsg.textContent = "金鑰正確。存取已授權。";
      gateMsg.className = "msg ok";
      confirmBtn.disabled = true;
      keyInput.disabled = true;
      document.getElementById("plaintextWrap").innerHTML = `
        <div class="plaintext">${PLAINTEXT}</div>
        <div class="row"><button class="btn" id="continueBtn">繼續</button></div>
      `;
      document.getElementById("continueBtn").addEventListener("click", renderNickname);
    } else {
      state.attempts++;
      gateMsg.textContent = `金鑰錯誤。已記錄第 ${state.attempts} 次嘗試。`;
      gateMsg.className = "msg error";
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      if(state.attempts >= 3) hintPanel.classList.add("open");
    }
  }
  confirmBtn.addEventListener("click", trySolve);
  keyInput.addEventListener("keydown", (e)=>{ if(e.key === "Enter") trySolve(); });
}

/* ============ STAGE: NICKNAME ============ */
function renderNickname(){
  mount(`
    <div class="card">
      ${corners()}
      <p class="eyebrow">ECHO PROTOCOL // INTAKE</p>
      <h1>登記代號</h1>
      <p class="sub">往後的紀錄都會以此稱呼你。它不必是你的真名。</p>
      <span class="field-label">代號 / 暱稱</span>
      <input id="nickInput" type="text" maxlength="24" placeholder="輸入你的代號...">
      <div class="row"><button class="btn" id="nickBtn">開始評估</button></div>
      <p class="msg error" id="nickMsg"></p>
    </div>
  `);
  const nickInput = document.getElementById("nickInput");
  const nickMsg = document.getElementById("nickMsg");
  function proceed(){
    const v = nickInput.value.trim();
    if(!v){ nickMsg.textContent = "代號不能為空。"; return; }
    state.nickname = v;
    state.qi = 0;
    state.order = shuffled(QUESTIONS.map((_,i)=>i));
    renderQuiz();
  }
  document.getElementById("nickBtn").addEventListener("click", proceed);
  nickInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") proceed(); });
  nickInput.focus();
}

/* ============ STAGE: QUIZ ============ */
function renderQuiz(){
  const total = QUESTIONS.length;
  const qIndex = state.order[state.qi];
  const question = QUESTIONS[qIndex];
  const opts = shuffled(question.opts);

  const ticks = state.order.map((_,i)=>{
    const cls = i < state.qi ? "done" : (i === state.qi ? "current" : "");
    return `<span class="tick ${cls}"></span>`;
  }).join("");

  mount(`
    <div class="card">
      ${corners()}
      <p class="eyebrow">ECHO PROTOCOL // ASSESSMENT — ${state.nickname}</p>
      <div class="strip">${ticks}</div>
      <p class="q-count">問題 ${state.qi+1} / ${total}</p>
      <p class="q-text">${question.q}</p>
      <div class="opts">
        ${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${o.x}</span></button>`).join("")}
      </div>
    </div>
  `);

  const buttons = Array.from(document.querySelectorAll(".opt"));
  buttons.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      buttons.forEach(b=> b.disabled = true);
      btn.classList.add("selected");
      const chosen = opts[parseInt(btn.dataset.i,10)];
      state.scores[chosen.t] += chosen.p;
      state.total += chosen.p;
      setTimeout(()=>{
        if(state.qi + 1 >= total){ finishQuiz(); }
        else { state.qi++; renderQuiz(); }
      }, 420);
    });
  });
}

function finishQuiz(){
  let bestTag = "neutral", bestCount = -1;
  PRIORITY.forEach(tag=>{
    if(state.scores[tag] === undefined) return;
  });
  // identity chosen by which trait accumulated the most points, priority list breaks ties
  PRIORITY.forEach(tag=>{
    const val = state.scores[tag];
    if(val > bestCount){ bestCount = val; bestTag = tag; }
  });
  const identity = TAG_TO_IDENTITY[bestTag];
  const tier = getTier(state.total);
  const advKey = generateAdvancedKey();
  const caseId = "EP-" + Date.now().toString(36).toUpperCase();
  renderResult({identity, tier, advKey, caseId});
}

/* ============ STAGE: RESULT ============ */
function renderResult({identity, tier, advKey, caseId}){
  mount(`
    <div class="card">
      ${corners()}
      <p class="eyebrow">ECHO PROTOCOL // CLEARANCE DOSSIER</p>
      <h1>評估完成</h1>
      <p class="sub">案件 ${caseId} 已封存。以下為系統判定的最終結果。</p>

      <div class="badge">${tier}</div>

      <dl class="dossier-grid">
        <dt>代號</dt><dd>${state.nickname}</dd>
        <dt>身份</dt><dd>${identity.name} <span class="tagline">— ${identity.tag}</span></dd>
        <dt>權限等級</dt><dd>${tier}</dd>
        <dt>深度指數</dt><dd>${state.total} / 133</dd>
      </dl>

      <span class="field-label">高級密鑰</span>
      <div class="key-box"><span id="keyText">${advKey}</span><button class="btn secondary" id="copyBtn" type="button">複製</button></div>
      <p class="msg" id="copyMsg"></p>

      <div class="row"><button class="btn secondary" id="resetBtn" type="button">重新測驗</button></div>
    </div>
  `);

  document.getElementById("copyBtn").addEventListener("click", ()=>{
    const txt = document.getElementById("keyText").textContent;
    const msg = document.getElementById("copyMsg");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>{
        msg.textContent = "已複製到剪貼簿。"; msg.className = "msg ok";
      }).catch(()=>{ msg.textContent = "複製失敗,請手動選取。"; msg.className = "msg error"; });
    } else {
      msg.textContent = "請手動選取複製。"; msg.className = "msg error";
    }
  });
  document.getElementById("resetBtn").addEventListener("click", ()=>{
    state.stage = "gate"; state.attempts = 0; state.nickname = ""; state.qi = 0;
    state.scores = {order:0,power:0,chaos:0,empathy:0,sacrifice:0,curiosity:0,deception:0,passive:0,neutral:0};
    state.total = 0;
    renderGate();
  });
}

renderGate();
})();
